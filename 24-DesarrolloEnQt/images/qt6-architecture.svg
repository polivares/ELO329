<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de una aplicación Qt 6</title>
  <desc id="desc">Capas entre el código de aplicación, módulos Qt, herramientas de construcción y plataformas destino.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #12394f; }
      .label { font: 700 20px Arial, sans-serif; fill: #12394f; }
      .text { font: 16px Arial, sans-serif; fill: #273444; }
      .small { font: 14px Arial, sans-serif; fill: #405466; }
      .box { rx: 10; ry: 10; stroke-width: 2; }
      .app { fill: #e7f5ef; stroke: #1f9d66; }
      .qt { fill: #eaf3fb; stroke: #2f6f9f; }
      .tool { fill: #fff4df; stroke: #b7791f; }
      .platform { fill: #f3f4f6; stroke: #6b7280; }
      .arrow { stroke: #405466; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#405466"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">Qt 6: una capa de abstracción para aplicaciones C++</text>

  <rect x="140" y="78" width="820" height="86" class="box app"/>
  <text x="550" y="112" text-anchor="middle" class="label">Tu aplicación</text>
  <text x="550" y="140" text-anchor="middle" class="text">clases C++ propias, ventanas, estado del dominio y reglas de negocio</text>

  <path d="M550 164 V198" class="arrow"/>

  <rect x="90" y="200" width="920" height="140" class="box qt"/>
  <text x="550" y="232" text-anchor="middle" class="label">APIs y módulos Qt 6</text>
  <rect x="130" y="258" width="145" height="48" class="box qt"/>
  <text x="202" y="288" text-anchor="middle" class="text">QtCore</text>
  <rect x="300" y="258" width="145" height="48" class="box qt"/>
  <text x="372" y="288" text-anchor="middle" class="text">QtGui</text>
  <rect x="470" y="258" width="145" height="48" class="box qt"/>
  <text x="542" y="288" text-anchor="middle" class="text">QtWidgets</text>
  <rect x="640" y="258" width="145" height="48" class="box qt"/>
  <text x="712" y="288" text-anchor="middle" class="text">QtQuick/QML</text>
  <rect x="810" y="258" width="160" height="48" class="box qt"/>
  <text x="890" y="288" text-anchor="middle" class="text">Add-ons</text>

  <path d="M550 340 V374" class="arrow"/>

  <rect x="110" y="376" width="880" height="92" class="box tool"/>
  <text x="550" y="408" text-anchor="middle" class="label">Herramientas que conectan C++ con Qt</text>
  <text x="550" y="437" text-anchor="middle" class="text">Qt Creator + CMake + moc + uic + rcc</text>
  <text x="550" y="458" text-anchor="middle" class="small">compilan código, procesan Q_OBJECT, traducen .ui y empaquetan recursos</text>

  <path d="M550 468 V502" class="arrow"/>

  <rect x="80" y="504" width="940" height="78" class="box platform"/>
  <text x="550" y="533" text-anchor="middle" class="label">Plataformas destino</text>
  <text x="550" y="562" text-anchor="middle" class="text">Windows | macOS | Linux | Android | iOS | sistemas embebidos</text>
</svg>
