<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Copia baja versus copia profunda</title>
  <desc id="desc">Comparacion visual entre dos objetos Student que comparten el mismo arreglo en heap y dos objetos Student con arreglos independientes.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f6f9f"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b42318"/>
    </marker>
    <linearGradient id="left-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="right-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #12394f; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 15px Arial, sans-serif; fill: #334155; }
      .code { font: 15px "DejaVu Sans Mono", Consolas, monospace; fill: #0f172a; }
      .heap-title { font: 700 16px Arial, sans-serif; fill: #155e75; }
      .warning { font: 700 15px Arial, sans-serif; fill: #b42318; }
    </style>
  </defs>

  <rect x="20" y="20" width="540" height="480" rx="18" fill="url(#left-bg)" stroke="#fb923c" stroke-width="2"/>
  <rect x="620" y="20" width="540" height="480" rx="18" fill="url(#right-bg)" stroke="#2f6f9f" stroke-width="2"/>

  <text x="290" y="62" text-anchor="middle" class="title">Copia baja</text>
  <text x="290" y="88" text-anchor="middle" class="subtitle">Se copia la direccion del arreglo</text>
  <text x="890" y="62" text-anchor="middle" class="title">Copia profunda</text>
  <text x="890" y="88" text-anchor="middle" class="subtitle">Se copian los datos a otro arreglo</text>

  <g filter="url(#shadow)">
    <rect x="70" y="135" width="185" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="70" y="135" width="185" height="34" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
    <text x="162.5" y="158" text-anchor="middle" class="label">Student x</text>
    <text x="88" y="196" class="code">count = 3</text>
    <text x="88" y="224" class="code">courses = 0xA0</text>

    <rect x="70" y="305" width="185" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="70" y="305" width="185" height="34" rx="10" fill="#fee2e2" stroke="#94a3b8"/>
    <text x="162.5" y="328" text-anchor="middle" class="label">Student y</text>
    <text x="88" y="366" class="code">count = 3</text>
    <text x="88" y="394" class="code">courses = 0xA0</text>

    <rect x="350" y="205" width="145" height="160" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="422.5" y="231" text-anchor="middle" class="heap-title">Heap</text>
    <rect x="375" y="250" width="95" height="28" fill="#fde68a" stroke="#ca8a04"/>
    <rect x="375" y="278" width="95" height="28" fill="#fef3c7" stroke="#ca8a04"/>
    <rect x="375" y="306" width="95" height="28" fill="#fde68a" stroke="#ca8a04"/>
    <text x="422.5" y="269" text-anchor="middle" class="small">ELO329</text>
    <text x="422.5" y="297" text-anchor="middle" class="small">ELO320</text>
    <text x="422.5" y="325" text-anchor="middle" class="small">TEL101</text>
  </g>

  <path d="M255 223 C300 223, 315 262, 367 262" fill="none" stroke="#b42318" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M255 393 C300 393, 315 313, 367 313" fill="none" stroke="#b42318" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="290" y="455" text-anchor="middle" class="warning">Riesgo: doble delete[] y cambios compartidos</text>

  <g filter="url(#shadow)">
    <rect x="670" y="135" width="185" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="670" y="135" width="185" height="34" rx="10" fill="#dbeafe" stroke="#94a3b8"/>
    <text x="762.5" y="158" text-anchor="middle" class="label">Student x</text>
    <text x="688" y="196" class="code">count = 3</text>
    <text x="688" y="224" class="code">courses = 0xA0</text>

    <rect x="670" y="305" width="185" height="115" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="670" y="305" width="185" height="34" rx="10" fill="#dcfce7" stroke="#94a3b8"/>
    <text x="762.5" y="328" text-anchor="middle" class="label">Student y</text>
    <text x="688" y="366" class="code">count = 3</text>
    <text x="688" y="394" class="code">courses = 0xB0</text>

    <rect x="950" y="132" width="145" height="145" rx="10" fill="#eff6ff" stroke="#2f6f9f" stroke-width="2"/>
    <text x="1022.5" y="158" text-anchor="middle" class="heap-title">Heap 0xA0</text>
    <rect x="975" y="177" width="95" height="28" fill="#bfdbfe" stroke="#2f6f9f"/>
    <rect x="975" y="205" width="95" height="28" fill="#dbeafe" stroke="#2f6f9f"/>
    <rect x="975" y="233" width="95" height="28" fill="#bfdbfe" stroke="#2f6f9f"/>
    <text x="1022.5" y="196" text-anchor="middle" class="small">ELO329</text>
    <text x="1022.5" y="224" text-anchor="middle" class="small">ELO320</text>
    <text x="1022.5" y="252" text-anchor="middle" class="small">TEL101</text>

    <rect x="950" y="318" width="145" height="145" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1022.5" y="344" text-anchor="middle" class="heap-title">Heap 0xB0</text>
    <rect x="975" y="363" width="95" height="28" fill="#bbf7d0" stroke="#16a34a"/>
    <rect x="975" y="391" width="95" height="28" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="975" y="419" width="95" height="28" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="1022.5" y="382" text-anchor="middle" class="small">ELO329</text>
    <text x="1022.5" y="410" text-anchor="middle" class="small">ELO320</text>
    <text x="1022.5" y="438" text-anchor="middle" class="small">TEL101</text>
  </g>

  <path d="M855 223 C900 223, 910 192, 968 192" fill="none" stroke="#2f6f9f" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M855 393 C900 393, 910 378, 968 378" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="890" y="485" text-anchor="middle" class="small">Cada destructor libera solo su propio arreglo</text>
</svg>
